info.school.name=luv2code
info.app.name=My Super Cool Gradebook
info.app.description=a fun way to track student grades!
info.app.version=1.0.0

## Server Properties
server.port= 1500

## H2 Test Database creds
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql = true

spring.main.banner-mode=off
logging.level.root=WARN
logging.level.org.springframework=WARN


sql.scripts.create.student = insert into student(firstname, lastname, email_address) \
  values ('Aryan', 'Pathak', 'arry@gmail.com')

sql.scripts.create.math.grade = insert into math_grade(student_id, grade) values (1, 95.50)
sql.scripts.create.history.grade = insert into history_grade(student_id, grade) values (1, 85.80)
sql.scripts.create.science.grade = insert into science_grade(student_id, grade) values (1, 92.00)

sql.scripts.delete.student = delete from student; alter table student alter column id restart with 1

sql.scripts.delete.math_grade = delete from math_grade; alter table math_grade alter column id restart with 1
sql.scripts.delete.science_grade = delete from science_grade; alter table science_grade alter column id restart with 1
sql.scripts.delete.history_grade = delete from history_grade; alter table history_grade alter column id restart with 1










